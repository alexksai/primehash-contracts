[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200 # small code: contract creation is much more expensive per byte on current Ethereum forks
bytecode_hash = "none"
fuzz = { runs = 1000 }

[profile.ci]
fuzz = { runs = 20000 }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[invariant]
runs = 64
depth = 40
fail_on_revert = true

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
